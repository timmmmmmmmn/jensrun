<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Jens Run beheer</title>
<style>
  :root { --orange: #ff8a00; --ink: #1d1a24; --muted: #6d6677; --line: #eadfcd; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #fffaf0; color: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { color: var(--orange); margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 20px 0 8px; }
  .row { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; min-width: 0; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 14px; background: var(--orange); color: #fff; cursor: pointer; }
  button.del { background: #e5383b; padding: 6px 10px; }
  button.pw, button.ren { background: #555; padding: 2px 6px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; color: var(--muted); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  #msg { color: var(--muted); margin-bottom: 12px; }
  .wrap { overflow-x: auto; }
  .nform { display: flex; flex-direction: column; gap: 10px; background: #fff; padding: 14px; border-radius: 12px; margin-bottom: 12px; }
  .nform label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; flex: 1; }
  .nform textarea, .nform select { font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
  .nform .row { margin: 0; }
  #nPrev { max-width: 260px; border-radius: 10px; }
  .nthumb { width: 72px; height: 44px; object-fit: cover; border-radius: 6px; display: block; }
  tr.oud td { opacity: .45; }
</style>
</head>
<body>
<main>
  <h1>Jens Run beheer</h1>
  <div class="row">
    <input id="key" type="password" placeholder="Beheersleutel" autocomplete="current-password">
    <button id="load">Laden</button>
  </div>
  <div id="msg"></div>
  <div id="newsBox" hidden>
    <h2>Nieuws in het hoofdmenu</h2>
    <div class="nform">
      <label>Titel <input id="nTitle" maxlength="80" placeholder="Bijvoorbeeld: NEC wint de beker!"></label>
      <label>Tekst <textarea id="nBody" rows="4" maxlength="2000" placeholder="Het hele bericht (mag leeg)"></textarea></label>
      <div class="row nrow">
        <label>Hoelang zichtbaar <input id="nDur" type="number" min="1" value="3"></label>
        <label>&nbsp;<select id="nUnit"><option value="1">uur</option><option value="24" selected>dagen</option><option value="168">weken</option></select></label>
      </div>
      <label>Plaatje (mag leeg) <input id="nImg" type="file" accept="image/*"></label>
      <img id="nPrev" alt="" hidden>
      <div class="row"><button id="nAdd">Nieuws plaatsen</button></div>
    </div>
    <div class="wrap"><table id="newsTbl"><thead><tr><th></th><th>Titel</th><th>Staat tot</th><th></th></tr></thead><tbody></tbody></table></div>
  </div>
  <div id="cfg" hidden>
    <h2>NEC-wedstrijddagen (één datum per regel, JJJJ-MM-DD)</h2>
    <textarea id="dates" rows="6" style="width:100%;font:inherit;padding:8px;border:2px solid var(--line);border-radius:10px"></textarea>
    <div class="row" style="margin-top:8px"><button id="saveDates">Opslaan</button></div>
    <h2>De muur</h2>
    <p id="wallNow">–</p>
    <button id="clearWall" class="del">Muur leegmaken</button>
  </div>
  <h2 id="fameH" hidden>Wall of Fame</h2>
  <div class="wrap"><table id="fame" hidden>
    <thead><tr><th>Naam</th><th>Verhaal</th><th>Score</th><th>Datum</th><th></th></tr></thead>
    <tbody></tbody>
  </table></div>
  <h2 id="spelersH" hidden>Ranglijst-spelers</h2>
  <div class="wrap"><table id="tbl" hidden>
    <thead><tr><th>Naam</th><th>Fiets</th><th>Rennen</th><th>Vakken</th><th>School</th><th>Sinds</th><th></th></tr></thead>
    <tbody></tbody>
  </table></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
try { $('#key').value = localStorage.getItem('jr-admin') || ''; } catch (e) {}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function call(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', 'x-admin-key': $('#key').value } });
  if (!r.ok) throw new Error(r.status === 401 ? 'Verkeerde sleutel' : 'Fout ' + r.status);
  return r.json();
}
async function load() {
  try { localStorage.setItem('jr-admin', $('#key').value); } catch (e) {}
  try {
    const { rows } = await call('/api/admin/players');
    $('#msg').textContent = rows.length + ' spelers';
    $('#tbl').hidden = false;
    $('#tbl tbody').innerHTML = rows.map((r) => `<tr>
      <td>${esc(r.name)} <button class="ren" data-ren="${esc(r.id)}" data-name="${esc(r.name)}" title="Naam aanpassen">Naam</button>${r.email ? `<br><small>${esc(r.email)}</small> <button class="pw" data-pw="${esc(r.id)}" data-name="${esc(r.name)}">Wachtwoord</button>` : ''}</td><td class="n">${r.fiets ?? ''}</td><td class="n">${r.telefoon ?? ''}</td><td class="n">${r.terror ?? ''}</td><td class="n">${r.school ?? ''}</td>
      <td>${new Date(r.created).toLocaleDateString('nl-NL')}</td>
      <td><button class="del" data-id="${esc(r.id)}" data-name="${esc(r.name)}">Verwijder</button></td></tr>`).join('');
    const cfg = await call('/api/admin/config');
    $('#cfg').hidden = false;
    $('#dates').value = (cfg.wedstrijden || []).join('\n');
    $('#wallNow').textContent = cfg.wall ? `${cfg.wall.name}: ${cfg.wall.text}` : 'Leeg';
    await loadNewsAdmin();
    const f = await call('/api/admin/fame');
    $('#fame').hidden = false; $('#fameH').hidden = false; $('#spelersH').hidden = false;
    $('#fame tbody').innerHTML = f.rows.length ? f.rows.map((r) => `<tr><td>${esc(r.name)}</td><td>${r.c === 'nl' ? 'Nederland' : 'Nijmegen'}</td><td class="n">${r.score}</td>
      <td>${new Date(r.created).toLocaleDateString('nl-NL')}</td>
      <td><button class="del" data-fame="${esc(r.id)}" data-c="${r.c}" data-name="${esc(r.name)}">Verwijder</button></td></tr>`).join('') : '<tr><td colspan="5">Nog niemand</td></tr>';
  } catch (e) { $('#msg').textContent = e.message; $('#tbl').hidden = true; }
}
$('#fame').onclick = async (e) => {
  const b = e.target.closest('.del');
  if (!b || !confirm(`${b.dataset.name} van de Wall of Fame halen?`)) return;
  try { await call('/api/admin/fame/delete', { method: 'POST', body: JSON.stringify({ id: b.dataset.fame, c: b.dataset.c }) }); load(); }
  catch (err) { $('#msg').textContent = err.message; }
};
$('#load').onclick = load;
$('#key').onkeydown = (e) => { if (e.key === 'Enter') load(); };
$('#tbl').addEventListener('click', async (e) => {
  const b = e.target.closest('.ren');
  if (!b) return;
  const name = prompt(`Nieuwe naam voor ${b.dataset.name} (2 tot 16 tekens):`, b.dataset.name);
  if (!name || name === b.dataset.name) return;
  try {
    const r = await fetch('/api/admin/rename', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-key': $('#key').value }, body: JSON.stringify({ id: b.dataset.ren, name }) });
    const d = await r.json();
    if (!r.ok) { $('#msg').textContent = d.error || 'Fout ' + r.status; return; }
    await load();
    $('#msg').textContent = `${b.dataset.name} heet nu ${d.name}`;
  } catch (err) { $('#msg').textContent = err.message; }
});
$('#tbl').addEventListener('click', async (e) => {
  const p = e.target.closest('.pw');
  if (!p) return;
  const pw = prompt(`Nieuw wachtwoord voor ${p.dataset.name} (min. 8 tekens):`);
  if (!pw) return;
  try { const r = await call('/api/admin/password', { method: 'POST', body: JSON.stringify({ id: p.dataset.pw, password: pw }) }); $('#msg').textContent = r.ok ? 'Wachtwoord gewijzigd' : 'Geen account'; }
  catch (err) { $('#msg').textContent = err.message; }
});
$('#tbl').onclick = async (e) => {
  const b = e.target.closest('.del');
  if (!b || !confirm(`${b.dataset.name} en alle scores verwijderen?`)) return;
  try { await call('/api/admin/delete', { method: 'POST', body: JSON.stringify({ id: b.dataset.id }) }); load(); }
  catch (err) { $('#msg').textContent = err.message; }
};
if ($('#key').value) load();
// ---------- nieuws ----------
let nImage = null;
async function loadNewsAdmin() {
  const { rows } = await call('/api/admin/news');
  $('#newsBox').hidden = false;
  const now = Date.now();
  $('#newsTbl tbody').innerHTML = rows.length ? rows.map((r) => `<tr class="${r.until < now ? 'oud' : ''}"><td>${r.has_img ? `<img class="nthumb" src="/api/news/img/${esc(r.id)}" alt="">` : ''}</td><td><b>${esc(r.title)}</b><br><small>${esc(r.body).slice(0, 90)}</small></td>
    <td>${new Date(r.until).toLocaleString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}${r.until < now ? ' (verlopen)' : ''}</td>
    <td><button class="del" data-n="${esc(r.id)}" data-t="${esc(r.title)}">Verwijder</button></td></tr>`).join('') : '<tr><td colspan="4">Nog geen nieuws. Dan staat er het standaardbericht over 2.0.</td></tr>';
}
// plaatje alvast verkleinen in de browser: past dan altijd in de database
$('#nImg').onchange = async () => {
  nImage = null; $('#nPrev').hidden = true;
  const f = $('#nImg').files[0];
  if (!f) return;
  try {
    const bmp = await createImageBitmap(f), k = Math.min(1, 960 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    nImage = c.toDataURL('image/jpeg', 0.82);
    $('#nPrev').src = nImage; $('#nPrev').hidden = false;
  } catch (e) { $('#msg').textContent = 'Dat plaatje kan ik niet openen.'; }
};
$('#nAdd').onclick = async () => {
  try {
    const hours = Number($('#nDur').value) * Number($('#nUnit').value);
    const r = await fetch('/api/admin/news', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-key': $('#key').value }, body: JSON.stringify({ title: $('#nTitle').value, body: $('#nBody').value, hours, image: nImage }) });
    const d = await r.json();
    if (!r.ok) { $('#msg').textContent = d.error || 'Fout ' + r.status; return; }
    $('#nTitle').value = ''; $('#nBody').value = ''; $('#nImg').value = ''; nImage = null; $('#nPrev').hidden = true;
    $('#msg').textContent = 'Nieuws geplaatst';
    loadNewsAdmin();
  } catch (e) { $('#msg').textContent = e.message; }
};
$('#newsTbl').onclick = async (e) => {
  const b = e.target.closest('[data-n]');
  if (!b || !confirm(`"${b.dataset.t}" verwijderen?`)) return;
  try { await call('/api/admin/news/delete', { method: 'POST', body: JSON.stringify({ id: b.dataset.n }) }); loadNewsAdmin(); }
  catch (err) { $('#msg').textContent = err.message; }
};
$('#saveDates').onclick = async () => {
  try { await call('/api/admin/config', { method: 'POST', body: JSON.stringify({ wedstrijden: $('#dates').value.split(/\s+/).filter(Boolean) }) }); load(); }
  catch (e) { $('#msg').textContent = e.message; }
};
$('#clearWall').onclick = async () => {
  if (!confirm('Muur leegmaken?')) return;
  try { await call('/api/admin/config', { method: 'POST', body: JSON.stringify({ clearWall: true }) }); load(); }
  catch (e) { $('#msg').textContent = e.message; }
};
</script>
</body>
</html>
